decision_rules:
- High product relevance can justify a bounded launch even when projected clicks are below 50-100.
- Use exact match by default; bounded phrase match is allowed for fresh, directly relevant India demand when exact-heavy groups have zero delivery.
- Do not use broad match, generic messages-app terms, competitor terms, or privacy-only terms in this launch.
- Do not change budget based on Google recommendations without explicit user approval.
- Keep the daily Search budget fixed at INR 20 while testing recovery; the CPC ceiling may rise only to the fresh planner high-range bound.
